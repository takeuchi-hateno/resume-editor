<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>履歴書・職務経歴書 PDF生成ツール</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#eef1f5; color:#1f2937; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
    main { width:min(720px,100%); background:#fff; border:1px solid #d6dbe3; border-radius:14px; padding:28px; box-shadow:0 8px 28px rgba(22,32,51,.08); }
    h1 { margin:0 0 10px; font-size:24px; }
    p { color:#687386; line-height:1.7; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px; }
    a { display:block; border:1px solid #d6dbe3; border-radius:12px; padding:20px; color:#172033; text-decoration:none; background:#fbfcfe; }
    a:hover { border-color:#4f76ff; box-shadow:0 0 0 3px rgba(79,118,255,.1); }
    strong { display:block; margin-bottom:6px; font-size:18px; }
    span { color:#687386; font-size:13px; line-height:1.6; }
    .note { margin-top:20px; font-size:12px; }
    @media (max-width:640px){ .choices{grid-template-columns:1fr;} main{padding:20px;} }
  </style>
</head>
<body>
  <main>
    <h1>履歴書・職務経歴書 PDF生成ツール</h1>
    <p>作成する書類を選んでください。どちらも入力内容はブラウザ内に保存され、サーバーへ送信しません。</p>
    <div class="choices">
      <a href="rirekisho_editor.html"><strong>履歴書を作る</strong><span>基本情報、学歴・職歴、資格、志望動機を入力してA4・2ページでPDF出力します。</span></a>
      <a href="resume_pdf_editor.html"><strong>職務経歴書を作る</strong><span>職務要約、案件、スキル、自己PRを編集してPDF出力します。</span></a>
    </div>
    <p class="note">履歴書側から、このブラウザに保存済みの職務経歴書データを読み込み、氏名と職歴を取り込むこともできます。</p>
  </main>
</body>
</html>
